<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeakUp: ingliz tili ustozi</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html,body{height:100%}
  body{height:100dvh}
  @keyframes bob{to{transform:translateY(-8px) scale(1.05)}}
  .talking{animation:bob .4s infinite alternate}
  @keyframes pulse{50%{box-shadow:0 0 0 14px rgba(244,63,94,.25)}}
  .rec{background:#f43f5e!important;animation:pulse 1.2s infinite}
  @media (prefers-reduced-motion:reduce){.talking,.rec{animation:none}}
  button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body class="bg-slate-950 text-white flex flex-col font-sans overflow-hidden">

<header class="bg-slate-900 border-b border-slate-800 p-3 flex justify-between items-center">
  <div class="flex items-center gap-2">
    <span id="h-av" class="text-2xl">🪳</span>
    <div>
      <div id="h-user" class="font-bold text-xs text-indigo-400">…</div>
      <div class="w-28 bg-slate-800 rounded-full h-1.5 mt-1"><div id="xp-bar" class="bg-green-500 h-1.5 rounded-full transition-all" style="width:0%"></div></div>
    </div>
  </div>
  <div class="flex gap-2 items-center">
    <span id="streak" class="text-xs font-bold text-amber-400">🔥 0</span>
    <button id="btn-av" class="bg-slate-800 border border-slate-700 px-2.5 py-1.5 rounded-lg text-xs">🎭</button>
    <button id="btn-set" class="bg-indigo-600 px-2.5 py-1.5 rounded-lg text-xs font-semibold">⚙️</button>
  </div>
</header>

<div id="modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
  <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl w-full max-w-sm space-y-3">
    <h3 class="text-base font-bold text-indigo-400">Sozlamalar</h3>
    <label class="block text-xs text-slate-400">Ismingiz
      <input id="in-name" class="w-full mt-1 p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-sm text-white"></label>
    <label class="block text-xs text-slate-400">Google Gemini API kaliti (aistudio.google.com). Faqat shu brauzerda saqlanadi.
      <input id="in-key" type="password" placeholder="AIzaSy..." class="w-full mt-1 p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-sm text-white"></label>
    <div class="flex gap-2">
      <button id="btn-save" class="flex-1 bg-green-600 py-2 rounded-xl text-sm font-bold">Saqlash</button>
      <button id="btn-close" class="flex-1 bg-slate-800 py-2 rounded-xl text-sm text-slate-300">Yopish</button>
    </div>
    <button id="btn-reset" class="w-full text-xs text-slate-500 underline">XP va suhbatni oʻchirish</button>
  </div>
</div>

<section class="bg-slate-900/60 p-3 flex flex-col items-center border-b border-slate-800">
  <div id="bubble" class="max-w-sm bg-slate-800 border border-slate-700 text-xs p-3 rounded-2xl text-center leading-relaxed"></div>
  <button id="avatar" aria-label="Qayta tinglash" class="text-6xl mt-2 select-none">🪳</button>
  <div id="a-name" class="text-[11px] font-bold text-slate-400"></div>
</section>

<main id="chat" class="flex-1 overflow-y-auto p-4 space-y-3" aria-live="polite"></main>

<footer class="p-3 bg-slate-900 border-t border-slate-800">
  <div id="live" class="text-[11px] text-slate-400 min-h-[1.1em] mb-1 text-center"></div>
  <div class="flex items-center gap-2">
    <button id="mic" aria-label="Gapirish" class="w-12 h-12 shrink-0 rounded-full bg-amber-500 text-xl">🎤</button>
    <input id="txt" placeholder="Gapiring yoki inglizcha yozing…" class="flex-1 p-3 bg-slate-800 border border-slate-700 text-sm rounded-xl placeholder-slate-500">
    <button id="send" class="bg-indigo-600 px-4 py-3 rounded-xl font-bold">➤</button>
  </div>
</footer>

<script>
const $ = id => document.getElementById(id);
const AVATARS = [
  {i:'🪳', n:'Jizzaki Tarakan'}, {i:'🍅', n:'Asabiy Pomidor'}, {i:'🥟', n:'Dovyurak Somsa'}
];
const LEVELS = ['A1 Beginner','A2 Elementary','B1 Intermediate','B2 Upper-Intermediate'];
const MODEL = 'gemini-2.5-flash';

let S = Object.assign({name:'', key:'', xp:0, streak:0, last:'', av:0}, JSON.parse(localStorage.getItem('speakup2')||'{}'));
let history = [];
let lastEnglish = 'Hello! Let us talk.';
let busy = false, rec = null;

const save = () => localStorage.setItem('speakup2', JSON.stringify(S));
const level = () => Math.min(3, Math.floor(S.xp/100));

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

function renderHeader(){
  const a = AVATARS[S.av];
  $('h-av').textContent = a.i; $('avatar').textContent = a.i;
  $('a-name').textContent = a.n + ' (ustoz)';
  $('h-user').textContent = (S.name||'Oʻquvchi') + ' · ' + LEVELS[level()];
  $('xp-bar').style.width = (S.xp%100) + '%';
  $('streak').textContent = '🔥 ' + S.streak;
}

function say(t){ $('bubble').textContent = t; }
function talk(on){ $('avatar').classList.toggle('talking', on); }

function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[*_#]/g,''));
  u.lang='en-US'; u.rate = level()<2 ? 0.85 : 1;
  u.onstart=()=>talk(true); u.onend=u.onerror=()=>talk(false);
  speechSynthesis.speak(u);
}

function addUser(text){
  const w = el('div','flex justify-end');
  w.appendChild(el('div','bg-indigo-600 p-3 rounded-2xl rounded-br-none max-w-[85%] text-sm', text));
  $('chat').appendChild(w); scroll();
}
function addAI(r){
  const a = AVATARS[S.av];
  const w = el('div','flex justify-start');
  const b = el('div','bg-slate-800 border border-slate-700 p-3 rounded-2xl rounded-tl-none max-w-[85%] text-sm space-y-2');
  b.appendChild(el('div','font-bold text-[10px] text-indigo-300', a.i+' '+a.n));
  b.appendChild(el('div','', r.english));
  if(r.correction) b.appendChild(el('div','text-amber-300 text-xs border-t border-slate-700 pt-2', '✏️ ' + r.correction));
  if(r.explain_uz) b.appendChild(el('div','text-slate-400 text-xs', r.explain_uz));
  if(r.tease) b.appendChild(el('div','text-slate-300 text-xs italic', r.tease));
  const btn = el('button','text-[11px] bg-slate-700 px-2 py-1 rounded text-indigo-300 font-bold','🔊 Qayta tinglash');
  btn.onclick = () => speak(r.english);
  b.appendChild(btn); w.appendChild(b); $('chat').appendChild(w); scroll();
}
function addNote(t){ $('chat').appendChild(el('div','text-center text-xs text-rose-300', t)); scroll(); }
function scroll(){ $('chat').scrollTop = $('chat').scrollHeight; }

function system(){
  return `You are "${AVATARS[S.av].n}", a funny, slightly sarcastic but kind English speaking tutor for ${S.name||'the student'}, an Uzbek speaker.
Student level: ${LEVELS[level()]}. Keep English simple and matched to this level.
Messages come from speech recognition or typing: ignore capitalization and punctuation mistakes.
Reply as JSON:
- english: 1-2 short English sentences reacting to the student, then ONE easy follow-up question.
- correction: the corrected version of the student's last sentence if it had a mistake, else "".
- explain_uz: short explanation of the mistake in Uzbek (Latin script), max 2 sentences, else "".
- tease: one short playful Uzbek joke about the mistake (never insulting or rude), or praise if correct. Max 12 words.
- correct: true if the student's last sentence had no real mistake.
If the student writes START, greet them by name and ask the first easy question.`;
}

async function ask(userText){
  busy = true; say('Oʻylayapman… 🤔'); talk(true);
  history.push({role:'user', text:userText});
  try{
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(S.key)}`;
    const res = await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        system_instruction:{parts:[{text:system()}]},
        contents: history.slice(-20).map(m=>({role:m.role, parts:[{text:m.text}]})),
        generationConfig:{
          temperature:0.8, responseMimeType:'application/json',
          responseSchema:{type:'OBJECT', properties:{
            english:{type:'STRING'}, correction:{type:'STRING'}, explain_uz:{type:'STRING'},
            tease:{type:'STRING'}, correct:{type:'BOOLEAN'}},
            required:['english','correction','explain_uz','tease','correct']}
        }
      })
    });
    const d = await res.json();
    if(!res.ok) throw new Error(d.error?.message || ('HTTP '+res.status));
    const r = JSON.parse(d.candidates[0].content.parts[0].text);
    history.push({role:'model', text:r.english});
    lastEnglish = r.english;
    say(r.english); addAI(r); speak(r.english);
    if(userText!=='START') gain(r.correct?10:3);
  }catch(e){
    history.pop(); talk(false);
    say('Xatolik yuz berdi.'); addNote('Xato: ' + e.message);
  }finally{ busy=false; }
}

function gain(p){
  const before = level();
  S.xp += p;
  const today = new Date().toDateString();
  if(S.last !== today){
    const y = new Date(Date.now()-864e5).toDateString();
    S.streak = (S.last===y) ? S.streak+1 : 1; S.last = today;
  }
  save(); renderHeader();
  if(level()>before) addNote('🎉 Yangi daraja: ' + LEVELS[level()]);
}

function send(text){
  text = (text||$('txt').value).trim();
  if(!text || busy) return;
  if(!S.key){ openModal(); return; }
  $('txt').value=''; $('live').textContent='';
  addUser(text); ask(text);
}

function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ addNote('Brauzer mikrofonni qoʻllamaydi. Chrome yoki Safari ishlating.'); return; }
  if(rec){ rec.stop(); return; }
  speechSynthesis.cancel();
  const r = new SR(); r.lang='en-US'; r.interimResults=true; r.continuous=false;
  r.onresult = e => {
    const t = Array.from(e.results).map(x=>x[0].transcript).join(' ');
    $('live').textContent = t;
    if(e.results[e.results.length-1].isFinal){ r.stop(); send(t); }
  };
  r.onerror = e => { $('live').textContent = 'Mikrofon xatosi: ' + e.error; };
  r.onend = () => { rec=null; $('mic').classList.remove('rec'); };
  rec = r; r.start(); $('mic').classList.add('rec'); $('live').textContent='Eshityapman…';
}

function openModal(){ $('in-name').value=S.name; $('in-key').value=S.key; $('modal').classList.remove('hidden'); }
function closeModal(){ $('modal').classList.add('hidden'); }

$('btn-set').onclick = openModal; $('btn-close').onclick = closeModal;
$('btn-save').onclick = () => {
  S.name = $('in-name').value.trim(); S.key = $('in-key').value.trim();
  if(!S.name || !S.key){ alert('Ism va kalitni kiriting.'); return; }
  save(); renderHeader(); closeModal();
  if(!history.length) ask('START');
};
$('btn-reset').onclick = () => {
  if(!confirm('XP, streak va suhbat oʻchirilsinmi?')) return;
  S.xp=0; S.streak=0; S.last=''; save(); history=[]; $('chat').textContent=''; renderHeader();
  if(S.key) ask('START');
};
$('btn-av').onclick = () => {
  S.av = (S.av+1)%AVATARS.length; save(); renderHeader();
  say(`Endi men ${AVATARS[S.av].n}man!`);
};
$('avatar').onclick = () => speak(lastEnglish);
$('send').onclick = () => send();
$('txt').addEventListener('keydown', e => { if(e.key==='Enter') send(); });
$('mic').onclick = toggleMic;

renderHeader();
if(S.key && S.name){ ask('START'); }
else { say('Salom! Avval ism va kalitni kiriting.'); openModal(); }
</script>
</body>
</html>
